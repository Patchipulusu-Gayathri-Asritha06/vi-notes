services:
  # Backend Service
  - type: web
    name: vi-notes-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false        # You will set this manually in Render dashboard
      - key: JWT_SECRET
        sync: false        # You will set this manually in Render dashboard
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false        # You will set this after frontend is deployed

  # Frontend Service
  - type: web
    name: vi-notes-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false        # You will set this after backend is deployed
    routes:
      - type: rewrite
        source: /*
        destination: /index.html